<!DOCTYPE html>

<head>

    <title>Anti-Slop UI | Research Paper</title>

<body>
    <div class="background-glow"></div>

    <nav class="glass-nav">

                    <defs>
                        <linearGradient id="grad1" x1="10" y1="10" x2="45" y2="45" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#EDEDED" />

                        <linearGradient id="grad2" x1="55" y1="10" x2="90" y2="45" gradientUnits="userSpaceOnUse">

                        </linearGradient>
                        <linearGradient id="grad3" x1="10" y1="55" x2="90" y2="90" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FFFFFF" stop-opacity="0.2" />
                            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />

                    </defs>
                </svg>
                <span class="logo-text">Anti-Slop UI</span>
            </a>
            <div class="links">

            <p>Read the formal methodology behind the State-Reset Architecture authored by Hassan Elkady.</p>
            <a href="research_paper.pdf" class="btn primary lg download-btn" download>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

        <div class="paper-container glass-panel" id="paper-content">

        </div>

    <footer>
        <div class="container footer-content">
            <div class="footer-left">
                <span>Anti-Slop UI © 2026.</span>
